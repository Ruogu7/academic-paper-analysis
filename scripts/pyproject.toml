[project]
name = "paper-reader"
version = "0.1.0"
description = "AI-powered academic paper reading and summarization agent"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=4.0.0",
    "pdfplumber>=0.10.0",
    "PyMuPDF>=1.23.0",
    "openai>=1.10.0",
    "anthropic>=0.18.0",
    "litellm>=1.35.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "mistune>=3.0.0",
    "httpx>=0.26.0",
    "requests>=2.31.0",
    "loguru>=0.7.0",
    "tiktoken>=0.5.0",
    "python-dotenv>=1.0.0",
    "pillow>=10.0.0",
    "pytest>=8.0.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
paper-reader = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
